[project]
name = "argospipe"
version = "0.1.0"
description = "Local CLI that finds job offers, filters them, and matches them against your CV with an LLM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "pypdf>=4",
    "keyring>=25",
    "platformdirs>=4",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "openai>=3.24.0",
]

[project.scripts]
argospipe = "argospipe.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["argospipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
